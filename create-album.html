<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Album</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Create Album</h1>
<p><a href="dashboard.html">&larr; Back to Dashboard</a></p>

<!-- ── Section 1: Create a new album ────────────────────────── -->
<section>
  <h2>New Album</h2>
  <label for="album-title">Album Title</label><br>
  <input id="album-title" type="text" placeholder="Album title"><br><br>
  <button id="create-album-btn">Create Album</button>
</section>

<!-- ── Section 2: Attach existing singles (shown after create) ── -->
<section id="attach-section" style="display:none;">
  <h2>Add your existing singles to this album (optional)</h2>
  <p>These are songs you've already published that aren't part of an album yet.</p>
  <ul id="unattached-list"></ul>
  <button id="attach-selected-btn">Attach Selected Songs</button>
  <p><a href="dashboard.html">Done — back to Dashboard</a></p>
</section>

<!-- ── Section 3: My Albums (edit existing) ──────────────────── -->
<section>
  <h2>My Albums</h2>
  <ul id="my-albums-list"><li>Loading...</li></ul>
</section>

<!-- ── Section 4: Inline edit form (hidden until Edit clicked) ── -->
<section id="edit-album-section" style="display:none;">
  <h2>Edit Album</h2>
  <label for="edit-album-title">Album Title</label><br>
  <input id="edit-album-title" type="text"><br><br>
  <button id="save-album-btn">Save Changes</button>
  <button id="cancel-album-edit-btn">Cancel</button>
</section>

<script type="module">
  import { db }              from './backend/supabaseClient.js';
  import { isCurrentUserArtist } from './backend/artists.js';
  import {
    createAlbum,
    getMyAlbums,
    getMyUnattachedSongs,
    attachSongToAlbum,
    updateAlbum,
    deleteAlbum
  } from './backend/albums.js';

  // ── Auth + artist guard ────────────────────────────────────────
  const { data: { user } } = await db.auth.getUser();
  if (!user) { window.location.href = 'login.html'; }

  const isArtist = await isCurrentUserArtist();
  if (!isArtist) {
    alert('You must be an artist to create albums. Become an artist first.');
    window.location.href = 'dashboard.html';
  }

  // ── State ──────────────────────────────────────────────────────
  let newAlbumId        = null;
  let currentEditAlbumId = null;

  // ── Render artist's own albums ─────────────────────────────────
  async function loadMyAlbums() {
    const albums = await getMyAlbums();
    const list   = document.getElementById('my-albums-list');
    list.innerHTML = '';

    if (albums.length === 0) {
      list.innerHTML = '<li><em>You have no albums yet.</em></li>';
      return;
    }

    albums.forEach(a => {
      const li = document.createElement('li');
      li.textContent = `${a.album_title}  `;

      const editBtn       = document.createElement('button');
      editBtn.textContent = 'Edit';
      editBtn.onclick     = () => openEditForm(a);
      li.appendChild(editBtn);

      const delBtn        = document.createElement('button');
      delBtn.textContent  = 'Delete';
      delBtn.style.marginLeft = '6px';
      delBtn.onclick = async () => {
        if (!confirm(`Delete album "${a.album_title}"? Songs in this album will become singles.`)) return;
        const ok = await deleteAlbum(a.albumid);
        if (ok) await loadMyAlbums();
      };
      li.appendChild(delBtn);

      list.appendChild(li);
    });
  }

  // ── Open inline edit form pre-filled with album data ──────────
  function openEditForm(album) {
    currentEditAlbumId = album.albumid;
    document.getElementById('edit-album-title').value = album.album_title;

    const editSection = document.getElementById('edit-album-section');
    editSection.style.display = 'block';
    editSection.scrollIntoView({ behavior: 'smooth' });
  }

  // ── Save edited album ──────────────────────────────────────────
  document.getElementById('save-album-btn').addEventListener('click', async () => {
    if (!currentEditAlbumId) return;

    const albumTitle = document.getElementById('edit-album-title').value.trim();
    if (!albumTitle) { alert('Album title cannot be empty.'); return; }

    const success = await updateAlbum(currentEditAlbumId, albumTitle);
    if (success) {
      alert('Album updated successfully!');
      document.getElementById('edit-album-section').style.display = 'none';
      currentEditAlbumId = null;
      await loadMyAlbums();
    }
  });

  // ── Cancel edit ────────────────────────────────────────────────
  document.getElementById('cancel-album-edit-btn').addEventListener('click', () => {
    document.getElementById('edit-album-section').style.display = 'none';
    currentEditAlbumId = null;
  });

  // ── Create a new album ─────────────────────────────────────────
  document.getElementById('create-album-btn').addEventListener('click', async () => {
    const title = document.getElementById('album-title').value.trim();
    if (!title) { alert('Please enter an album title.'); return; }

    const album = await createAlbum(title);
    if (!album) return;

    newAlbumId = album.albumid;
    alert(`Album "${album.album_title}" created.`);
    document.getElementById('album-title').value = '';

    // Show list of artist's own unattached singles so they can
    // optionally group existing songs into this new album.
    const singles = await getMyUnattachedSongs();
    const list    = document.getElementById('unattached-list');
    list.innerHTML = '';
    singles.forEach(s => {
      const li  = document.createElement('li');
      li.innerHTML = `<label><input type="checkbox" value="${s.songid}"> ${s.song_title}</label>`;
      list.appendChild(li);
    });
    document.getElementById('attach-section').style.display = singles.length ? 'block' : 'none';

    await loadMyAlbums();
  });

  // ── Attach selected singles to the newly created album ─────────
  document.getElementById('attach-selected-btn').addEventListener('click', async () => {
    const checked = document.querySelectorAll('#unattached-list input[type=checkbox]:checked');
    for (const checkbox of checked) {
      await attachSongToAlbum(checkbox.value, newAlbumId);
    }
    alert('Selected songs attached to the album.');
    window.location.href = 'dashboard.html';
  });

  // ── Init ───────────────────────────────────────────────────────
  await loadMyAlbums();
</script>
</body>
</html>
