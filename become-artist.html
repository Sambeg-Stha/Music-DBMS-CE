<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Become an Artist</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Become an Artist</h1>
<p><a href="dashboard.html">&larr; Back to Dashboard</a></p>

<section>
  <input id="artist-role" type="text" placeholder="e.g. Singer, Producer"><br>
  <button id="become-artist-btn">Become an Artist</button>
</section>

<script type="module">
  import { becomeArtist, isCurrentUserArtist } from './backend/artists.js';

  // Guard: if the user is already an artist, this page doesn't apply
  // to them -- send them back to the dashboard instead of letting
  // them submit the form again.
  const alreadyArtist = await isCurrentUserArtist();
  if (alreadyArtist) {
    alert('You are already an artist.');
    window.location.href = 'dashboard.html';
  }

  document.getElementById('become-artist-btn').addEventListener('click', async () => {
    const role = document.getElementById('artist-role').value;
    const success = await becomeArtist(role);
    if (success) window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
