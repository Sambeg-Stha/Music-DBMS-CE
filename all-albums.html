<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Albums</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>All Albums</h1>
<p><a href="dashboard.html">&larr; Back to Dashboard</a></p>
<p><em>Sorted by artist name</em></p>

<ul id="album-list"></ul>

<script type="module">
  import { getAllAlbumsSortedByArtist } from './backend/albums.js';

  async function loadAllAlbums() {
    const albums = await getAllAlbumsSortedByArtist();
    const list = document.getElementById('album-list');
    list.innerHTML = '';
    albums.forEach(a => {
      const artistName = a.artists?.users?.username || 'Unknown Artist';
      const li = document.createElement('li');
      li.textContent = `${artistName} - ${a.album_title}`;
      list.appendChild(li);
    });
  }

  loadAllAlbums();
</script>
</body>
</html>
