<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create &amp; Manage Playlists</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Playlist Manager</h1>
<p><a href="dashboard.html">&larr; Back to Dashboard</a></p>

<!-- ── Section 1: Create a new playlist ──────────────────────── -->
<section>
  <h2>Create a New Playlist</h2>
  <label for="playlist-name">Playlist Name</label><br>
  <input id="playlist-name" type="text" placeholder="Playlist Name"><br><br>
  <label>
    <input id="playlist-public" type="checkbox" checked>
    Public Playlist (Visible to everyone)
  </label><br><br>
  <button id="create-playlist-btn">Create Playlist</button>
</section>

<!-- ── Section 2: Manage playlist songs + rename/visibility ───── -->
<section id="manage-section">
  <h2>Add / Remove Songs</h2>
  <label for="my-playlists">Select your playlist:</label><br>
  <select id="my-playlists">
    <option value="">-- Select a Playlist --</option>
  </select>

  <!-- Edit playlist name / visibility (shown when a playlist is selected) -->
  <div id="playlist-edit-div" style="margin-top:12px; display:none;">
    <h3>Edit Playlist Details</h3>
    <label for="edit-playlist-name">Playlist Name</label><br>
    <input id="edit-playlist-name" type="text"><br><br>
    <label>
      <input id="edit-playlist-public" type="checkbox">
      Public
    </label><br><br>
    <button id="save-playlist-btn">Save Changes</button>
    <button id="delete-playlist-btn" style="margin-left:6px;">Delete Playlist</button>
  </div>

  <!-- Songs in playlist / available songs -->
  <div id="playlist-contents-div" style="margin-top: 15px; display: none;">
    <h3>Songs in Playlist</h3>
    <ul id="playlist-songs-list"></ul>

    <h3>Add Songs to Playlist</h3>
    <ul id="available-songs-list"></ul>
  </div>
</section>

<script type="module">
  import { db } from './backend/supabaseClient.js';
  import {
    createPlaylist,
    getMyPlaylists,
    addSongToPlaylist,
    removeSongFromPlaylist,
    getPlaylistSongs,
    updatePlaylist,
    deletePlaylist
  } from './backend/playlists.js';
  import { getAllSongs } from './backend/songs.js';

  // ── Auth guard ─────────────────────────────────────────────────
  const { data: { user } } = await db.auth.getUser();
  if (!user) { window.location.href = 'login.html'; }

  // ── State ──────────────────────────────────────────────────────
  let currentPlaylists = [];
  let allSongs         = [];

  // ── Init: load songs and playlists ────────────────────────────
  async function init() {
    allSongs = await getAllSongs();
    await refreshPlaylistsDropdown();
  }

  async function refreshPlaylistsDropdown() {
    const select     = document.getElementById('my-playlists');
    const savedValue = select.value; // preserve selection if refreshing
    select.innerHTML = '<option value="">-- Select a Playlist --</option>';
    currentPlaylists = await getMyPlaylists();

    currentPlaylists.forEach(p => {
      const opt         = document.createElement('option');
      opt.value         = p.playlistid;
      opt.textContent   = `${p.playlist_name} (${p.is_public ? 'Public' : 'Private'})`;
      select.appendChild(opt);
    });

    // Re-select if still present
    if (savedValue) select.value = savedValue;
  }

  // ── Create playlist ────────────────────────────────────────────
  document.getElementById('create-playlist-btn').addEventListener('click', async () => {
    const name     = document.getElementById('playlist-name').value.trim();
    const isPublic = document.getElementById('playlist-public').checked;

    if (!name) { alert('Please enter a playlist name.'); return; }

    const playlist = await createPlaylist(name, isPublic);
    if (playlist) {
      alert(`Playlist "${playlist.playlist_name}" created!`);
      document.getElementById('playlist-name').value = '';
      await refreshPlaylistsDropdown();
    }
  });

  // ── When user picks a playlist, show its details ───────────────
  document.getElementById('my-playlists').addEventListener('change', async (e) => {
    const playlistId   = e.target.value;
    const contentsDiv  = document.getElementById('playlist-contents-div');
    const editDiv      = document.getElementById('playlist-edit-div');

    if (!playlistId) {
      contentsDiv.style.display = 'none';
      editDiv.style.display     = 'none';
      return;
    }

    // Pre-fill the edit form with current playlist data
    const playlist = currentPlaylists.find(p => String(p.playlistid) === String(playlistId));
    if (playlist) {
      document.getElementById('edit-playlist-name').value   = playlist.playlist_name;
      document.getElementById('edit-playlist-public').checked = playlist.is_public;
    }

    editDiv.style.display     = 'block';
    contentsDiv.style.display = 'block';
    await loadPlaylistDetails(playlistId);
  });

  // ── Delete playlist ────────────────────────────────────────────
  document.getElementById('delete-playlist-btn').addEventListener('click', async () => {
    const playlistId = document.getElementById('my-playlists').value;
    if (!playlistId) return;

    const playlist = currentPlaylists.find(p => String(p.playlistid) === String(playlistId));
    const name     = playlist?.playlist_name || 'this playlist';

    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;

    const ok = await deletePlaylist(playlistId);
    if (ok) {
      // Hide the panels and reset the dropdown
      document.getElementById('playlist-edit-div').style.display     = 'none';
      document.getElementById('playlist-contents-div').style.display = 'none';
      await refreshPlaylistsDropdown();
    }
  });

  // ── Save playlist name / visibility changes ────────────────────
  document.getElementById('save-playlist-btn').addEventListener('click', async () => {
    const playlistId = document.getElementById('my-playlists').value;
    if (!playlistId) return;

    const newName    = document.getElementById('edit-playlist-name').value.trim();
    const isPublic   = document.getElementById('edit-playlist-public').checked;

    if (!newName) { alert('Playlist name cannot be empty.'); return; }

    const success = await updatePlaylist(playlistId, newName, isPublic);
    if (success) {
      alert('Playlist updated!');
      await refreshPlaylistsDropdown();
      // Update local cache so the edit form stays consistent
      const idx = currentPlaylists.findIndex(p => String(p.playlistid) === String(playlistId));
      if (idx !== -1) {
        currentPlaylists[idx].playlist_name = newName;
        currentPlaylists[idx].is_public     = isPublic;
      }
    }
  });

  // ── Load songs inside a playlist + available songs ─────────────
  async function loadPlaylistDetails(playlistId) {
    const inPlaylist    = await getPlaylistSongs(playlistId);
    const inPlaylistIds = new Set(inPlaylist.map(s => s.songid));

    // ── Songs currently in this playlist ──
    const playlistSongsList  = document.getElementById('playlist-songs-list');
    playlistSongsList.innerHTML = '';

    if (inPlaylist.length === 0) {
      playlistSongsList.innerHTML = '<li><em>No songs in this playlist yet.</em></li>';
    } else {
      inPlaylist.forEach(song => {
        const li        = document.createElement('li');
        li.textContent  = `${song.song_title} (${song.duration}s) `;

        const removeBtn       = document.createElement('button');
        removeBtn.textContent = 'Remove';
        removeBtn.style.marginLeft = '10px';
        removeBtn.onclick     = async () => {
          const ok = await removeSongFromPlaylist(playlistId, song.songid);
          if (ok) await loadPlaylistDetails(playlistId);
        };

        li.appendChild(removeBtn);
        playlistSongsList.appendChild(li);
      });
    }

    // ── Songs NOT yet in this playlist ──
    const availableSongsList  = document.getElementById('available-songs-list');
    availableSongsList.innerHTML = '';

    const availableSongs = allSongs.filter(s => !inPlaylistIds.has(s.songid));

    if (availableSongs.length === 0) {
      availableSongsList.innerHTML = '<li><em>All available songs are already in this playlist.</em></li>';
    } else {
      availableSongs.forEach(song => {
        const li       = document.createElement('li');
        li.textContent = `${song.song_title} (${song.duration}s) `;

        const addBtn       = document.createElement('button');
        addBtn.textContent = 'Add to Playlist';
        addBtn.style.marginLeft = '10px';
        addBtn.onclick     = async () => {
          const ok = await addSongToPlaylist(playlistId, song.songid);
          if (ok) await loadPlaylistDetails(playlistId);
        };

        li.appendChild(addBtn);
        availableSongsList.appendChild(li);
      });
    }
  }

  // ── Init ───────────────────────────────────────────────────────
  init();
</script>
</body>
</html>
