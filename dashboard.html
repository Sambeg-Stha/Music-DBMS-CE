<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Dashboard</h1>
<p id="status">Checking session...</p>
<p id="artist-status"></p>
<button id="logout-btn">Log Out</button>

<section>
  <h2>Actions</h2>
  <button id="become-artist-nav-btn" onclick="location.href='become-artist.html'">Become an Artist</button>
  <button onclick="location.href='create-album.html'">Create Album</button>
  <button onclick="location.href='publish-song.html'">Publish Song</button>
  <button onclick="location.href='create-playlist.html'">Create Playlist</button>
</section>

<section>
  <h2>Songs <small>(10 random)</small></h2>
  <ul id="song-list"></ul>
  <a href="all-songs.html">All Songs &rarr;</a>
</section>

<section>
  <h2>Albums <small>(10 random)</small></h2>
  <ul id="album-list"></ul>
  <a href="all-albums.html">All Albums &rarr;</a>
</section>

<section>
  <h2>Playlists <small>(10 random)</small></h2>
  <ul id="playlist-list"></ul>
  <a href="all-playlists.html">All Playlists &rarr;</a>
</section>

<script type="module">
  import { db } from './backend/supabaseClient.js';
  import { signOut } from './backend/auth.js';
  import { isCurrentUserArtist } from './backend/artists.js';
  import { getRandomSongs } from './backend/songs.js';
  import { getRandomAlbums } from './backend/albums.js';
  import { getRandomPlaylists } from './backend/playlists.js';

  // Guard: if not logged in, bounce back to login page.
  const { data: { user } } = await db.auth.getUser();
  if (!user) {
    window.location.href = 'login.html';
  } else {
    document.getElementById('status').textContent = `Logged in as ${user.email}`;
    const isArtist = await isCurrentUserArtist();
    document.getElementById('artist-status').textContent =
      isArtist ? 'You are an artist.' : 'You are a regular listener.';

    // Only listeners should see the option to become an artist.
    if (isArtist) {
      document.getElementById('become-artist-nav-btn').style.display = 'none';
    }
  }

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await signOut();
    window.location.href = 'login.html';
  });

  // Songs: displayed as "artist - song title"
  async function loadSongs() {
    const songs = await getRandomSongs(10);
    const list = document.getElementById('song-list');
    list.innerHTML = '';
    songs.forEach(s => {
      const artistName = s.artists?.users?.username || 'Unknown Artist';
      const li = document.createElement('li');
      li.textContent = `${artistName} - ${s.song_title}${s.albumid ? '' : ' (single)'}`;
      list.appendChild(li);
    });
  }

  // Albums: displayed as "artist - album title"
  async function loadAlbums() {
    const albums = await getRandomAlbums(10);
    const list = document.getElementById('album-list');
    list.innerHTML = '';
    albums.forEach(a => {
      const artistName = a.artists?.users?.username || 'Unknown Artist';
      const li = document.createElement('li');
      li.textContent = `${artistName} - ${a.album_title}`;
      list.appendChild(li);
    });
  }

  // Playlists: displayed as "user - playlist name"
  async function loadPlaylists() {
    const playlists = await getRandomPlaylists(10);
    const list = document.getElementById('playlist-list');
    list.innerHTML = '';
    playlists.forEach(p => {
      const ownerName = p.users?.username || 'Unknown User';
      const li = document.createElement('li');
      li.textContent = `${ownerName} - ${p.playlist_name}${p.is_public ? '' : ' (private)'}`;
      list.appendChild(li);
    });
  }

  loadSongs();
  loadAlbums();
  loadPlaylists();
</script>
</body>
</html>
