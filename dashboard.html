<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSE: Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>MUSE: Music Dashboard</h1>
<p id="status">Checking session...</p>
<p id="artist-status"></p>
<button id="logout-btn">Log Out</button>

<section>
  <h2>Actions</h2>
  <button id="become-artist-nav-btn" onclick="location.href='become-artist.html'">Become an Artist</button>
  <button onclick="location.href='create-album.html'">Create / Edit Album</button>
  <button onclick="location.href='publish-song.html'">Publish / Edit Song</button>
  <button onclick="location.href='create-playlist.html'">Create / Edit Playlist</button>
</section>

<section>
  <h2>Songs <small>(10 random — click to preview)</small></h2>
  <ul id="song-list"></ul>
  <a href="all-songs.html">All Songs &rarr;</a>
</section>

<section>
  <h2>Albums <small>(10 random — click for details)</small></h2>
  <ul id="album-list"></ul>
  <a href="all-albums.html">All Albums &rarr;</a>
</section>

<section>
  <h2>Playlists <small>(10 random — click for details)</small></h2>
  <ul id="playlist-list"></ul>
  <a href="all-playlists.html">All Playlists &rarr;</a>
</section>

<!-- ── Shared modal ────────────────────────────────────────────── -->
<div id="modal-overlay">
  <div id="modal-box">
    <button id="modal-close" aria-label="Close">&#x2715;</button>
    <div id="modal-content"></div>
  </div>
</div>

<script type="module">
  import { db }              from './backend/supabaseClient.js';
  import { signOut }         from './backend/auth.js';
  import { isCurrentUserArtist } from './backend/artists.js';
  import { getRandomSongs }  from './backend/songs.js';
  import { getRandomAlbums, getAlbumSongs } from './backend/albums.js';
  import { getRandomPlaylists, getPlaylistSongs } from './backend/playlists.js';

  // ── Auth guard ─────────────────────────────────────────────────
  const { data: { user } } = await db.auth.getUser();
  if (!user) {
    window.location.href = 'login.html';
  } else {
    document.getElementById('status').textContent = `Logged in as ${user.email}`;
    const isArtist = await isCurrentUserArtist();
    document.getElementById('artist-status').textContent =
      isArtist ? 'You are an artist.' : 'You are a regular listener.';

    // Only listeners should see the "Become an Artist" button
    if (isArtist) {
      document.getElementById('become-artist-nav-btn').style.display = 'none';
    }
  }

  // ── Logout ─────────────────────────────────────────────────────
  document.getElementById('logout-btn').addEventListener('click', async () => {
    await signOut();
    window.location.href = 'login.html';
  });

  // ── Modal helpers ──────────────────────────────────────────────
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');

  function openModal(html) {
    content.innerHTML = html;
    overlay.style.display = 'block';
  }

  function closeModal() {
    overlay.style.display = 'none';
    content.innerHTML = '';
  }

  // Close on ✕ button or clicking outside the box
  document.getElementById('modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

  // ── Duration formatter: 213s → "3:33" ─────────────────────────
  function fmtDuration(secs) {
    const m = Math.floor(secs / 60);
    const s = String(secs % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  // ── Song modal: "Now Playing" popup ───────────────────────────
  function showSongModal(song) {
    const artistName = song.artists?.users?.username || 'Unknown Artist';
    const genre      = song.song_genres?.[0]?.genre_name || '—';
    const duration   = fmtDuration(song.duration);

    openModal(`
      <h2>&#127925; Now Playing</h2>
      <h3 style="margin:8px 0;">"${song.song_title}"</h3>
      <p><strong>Artist:</strong> ${artistName}</p>
      <p><strong>Genre:</strong> ${genre}</p>
      <p><strong>Duration:</strong> ${duration}</p>
      ${!song.albumid ? '<p><em>Single release</em></p>' : ''}
    `);
  }

  // ── Album modal: album name + song list ────────────────────────
  async function showAlbumModal(album) {
    const artistName = album.artists?.users?.username || 'Unknown Artist';

    // Show loading state immediately
    openModal(`
      <h2>&#128191; ${album.album_title}</h2>
      <p><strong>Artist:</strong> ${artistName}</p>
      <p><em>Loading songs…</em></p>
    `);

    const songs = await getAlbumSongs(album.albumid);
    const songsHtml = songs.length
      ? '<ul>' + songs.map(s => {
          const genre = s.song_genres?.[0]?.genre_name || '';
          return `<li>${s.song_title} — ${fmtDuration(s.duration)}${genre ? ' · ' + genre : ''}</li>`;
        }).join('') + '</ul>'
      : '<p><em>No songs in this album yet.</em></p>';

    openModal(`
      <h2>&#128191; ${album.album_title}</h2>
      <p><strong>Artist:</strong> ${artistName}</p>
      <h3>Songs (${songs.length})</h3>
      ${songsHtml}
    `);
  }

  // ── Playlist modal: playlist name + song list ─────────────────
  async function showPlaylistModal(playlist) {
    const ownerName = playlist.users?.username || 'Unknown User';
    const visibility = playlist.is_public ? 'Public' : 'Private';

    // Show loading state immediately
    openModal(`
      <h2>&#128203; ${playlist.playlist_name}</h2>
      <p><strong>By:</strong> ${ownerName} &nbsp;|&nbsp; ${visibility}</p>
      <p><em>Loading songs…</em></p>
    `);

    const songs = await getPlaylistSongs(playlist.playlistid);
    const songsHtml = songs.length
      ? '<ul>' + songs.map(s =>
          `<li>${s.song_title} — ${fmtDuration(s.duration)}</li>`
        ).join('') + '</ul>'
      : '<p><em>No songs in this playlist yet.</em></p>';

    openModal(`
      <h2>&#128203; ${playlist.playlist_name}</h2>
      <p><strong>By:</strong> ${ownerName} &nbsp;|&nbsp; ${visibility}</p>
      <h3>Songs (${songs.length})</h3>
      ${songsHtml}
    `);
  }

  // ── Load songs (clickable) ─────────────────────────────────────
  async function loadSongs() {
    const songs = await getRandomSongs(10);
    const list  = document.getElementById('song-list');
    list.innerHTML = '';

    if (songs.length === 0) {
      list.innerHTML = '<li><em>No songs yet.</em></li>';
      return;
    }

    songs.forEach(s => {
      const artistName = s.artists?.users?.username || 'Unknown Artist';
      const li         = document.createElement('li');
      li.className     = 'clickable-item';
      li.textContent   = `${artistName} — ${s.song_title}${!s.albumid ? ' (single)' : ''}`;
      li.addEventListener('click', () => showSongModal(s));
      list.appendChild(li);
    });
  }

  // ── Load albums (clickable) ────────────────────────────────────
  async function loadAlbums() {
    const albums = await getRandomAlbums(10);
    const list   = document.getElementById('album-list');
    list.innerHTML = '';

    if (albums.length === 0) {
      list.innerHTML = '<li><em>No albums yet.</em></li>';
      return;
    }

    albums.forEach(a => {
      const artistName = a.artists?.users?.username || 'Unknown Artist';
      const li         = document.createElement('li');
      li.className     = 'clickable-item';
      li.textContent   = `${artistName} — ${a.album_title}`;
      li.addEventListener('click', () => showAlbumModal(a));
      list.appendChild(li);
    });
  }

  // ── Load playlists (clickable) ─────────────────────────────────
  async function loadPlaylists() {
    const playlists = await getRandomPlaylists(10);
    const list      = document.getElementById('playlist-list');
    list.innerHTML  = '';

    if (playlists.length === 0) {
      list.innerHTML = '<li><em>No playlists yet.</em></li>';
      return;
    }

    playlists.forEach(p => {
      const ownerName = p.users?.username || 'Unknown User';
      const li        = document.createElement('li');
      li.className    = 'clickable-item';
      li.textContent  = `${ownerName} — ${p.playlist_name}${!p.is_public ? ' (private)' : ''}`;
      li.addEventListener('click', () => showPlaylistModal(p));
      list.appendChild(li);
    });
  }

  // ── Init ───────────────────────────────────────────────────────
  loadSongs();
  loadAlbums();
  loadPlaylists();
</script>
</body>
</html>
